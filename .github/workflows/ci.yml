name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Start s2 lite (in-memory S2 emulator)
        run: docker run -d --name s2lite -p 8080:80 ghcr.io/s2-streamstore/s2 lite
      - name: Wait for s2 lite
        run: timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:8080; do sleep 1; done'
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (create → append → replay → delete)
        run: pnpm test:integration
        env:
          S2_TEST_ENDPOINT: http://localhost:8080
      - name: s2 lite logs
        if: failure()
        run: docker logs s2lite
